[project]
name = "investiq"
version = "0.1.0"
description = "InvestIQ: local-first AI investment research and portfolio intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    "anthropic>=2.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pip-audit>=2.7"]

[project.scripts]
investiq = "investiq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["investiq*"]

[tool.setuptools.package-data]
investiq = ["ai/prompts/*.md", "reports/templates/*", "seed/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:httpx2.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
