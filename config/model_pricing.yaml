# AI model prices used for cost estimation and the hard monthly budget.
#
# Prices MUST be re-verified against the provider's official pricing page before relying on them.
# If a model is missing here, InvestIQ refuses to call it (it cannot enforce the budget otherwise).
# Units: USD per million tokens. Thinking tokens are billed as output tokens.
version: "anthropic-2026-10-06"
verified_on: "2026-10-06"
verified_against: "Anthropic API pricing as published in the Claude API reference (https://platform.claude.com/docs/en/about-claude/pricing)"
models:
  claude-opus-5-5:   {provider: anthropic, input: 4.00, output: 20.00, cache_read: 0.20}
  claude-sonnet-5-5: {provider: anthropic, input: 2.00, output: 10.00, cache_read: 0.20}
  # Haiku 5.5: $0.10/$0.50 for prompts up to 100K tokens; $0.50/$2.50 beyond.
  claude-haiku-5-5:  {provider: anthropic, input: 0.10, output: 0.50, long_context_threshold: 100000, long_input: 0.50, long_output: 2.50}
  # Possible server-side fallback targets (priced so fallback usage is never under-counted).
  claude-opus-5:     {provider: anthropic, input: 5.00, output: 25.00}
  claude-opus-4-8:   {provider: anthropic, input: 5.00, output: 25.00}
  claude-sonnet-5:   {provider: anthropic, input: 2.00, output: 10.00}
